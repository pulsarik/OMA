<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Карточки столиц</title><style>body{margin:0;padding:32px;background:#202528;color:#fff;font-family:Arial,sans-serif}main{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:28px;max-width:1500px;margin:auto}figure{margin:0}img{display:block;width:100%;border-radius:18px;box-shadow:0 14px 34px #0008}figcaption{text-align:center;font-weight:800;margin-top:12px}@media(max-width:900px){main{grid-template-columns:1fr}}</style><main><figure><img src="./output/berlin.svg" alt="БЕРЛИН"><figcaption>БЕРЛИН</figcaption></figure><figure><img src="./output/paris.svg" alt="ПАРИЖ"><figcaption>ПАРИЖ</figcaption></figure><figure><img src="./output/tokyo.svg" alt="ТОКИО"><figcaption>ТОКИО</figcaption></figure></main></html>
