<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Статистика игр</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 24px;
    }
    h1, h2, p { margin-top: 0; }
    .heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    button, input {
      border: 1px solid #9ca3af;
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      font: inherit;
    }
    button { cursor: pointer; }
    .admin-auth { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .muted { color: #6b7280; font-size: 13px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card, .panel {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      padding: 16px;
    }
    .card strong {
      display: block;
      margin-top: 5px;
      font-size: 26px;
    }
    .panel { margin-bottom: 20px; }
    .table-scroll { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 9px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { color: #4b5563; font-size: 12px; text-transform: uppercase; }
    .user-agent {
      min-width: 260px;
      max-width: 480px;
      white-space: normal;
      overflow-wrap: anywhere;
      color: #6b7280;
      font-size: 12px;
    }
    .error {
      border-color: #fecaca;
      background: #fff1f2;
      color: #991b1b;
    }
    @media (max-width: 640px) {
      main { padding: 16px; }
      .heading { display: block; }
      .heading button { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="heading">
      <div>
        <h1>Общая статистика игр</h1>
        <p id="updated" class="muted">Загрузка…</p>
      </div>
      <div class="admin-auth">
        <input id="admin-token" type="password" autocomplete="current-password" placeholder="ADMIN_API_TOKEN" aria-label="ADMIN_API_TOKEN">
        <button onclick="saveTokenAndLoad()">Открыть / обновить</button>
      </div>
    </div>

    <section id="cards" class="cards"></section>

    <section class="panel">
      <h2>Устройства</h2>
      <div id="devices" class="table-scroll"></div>
    </section>

    <section class="panel">
      <h2>Адреса и параметры экранов</h2>
      <p class="muted">Одинаковые подключения сгруппированы по адресу и устройству.</p>
      <div id="accesses" class="table-scroll"></div>
    </section>
  </main>

  <script>
    const isLocalVite = window.location.hostname === 'localhost' && window.location.port !== '4000';
    const API_URL = isLocalVite ? 'http://localhost:4000' : window.location.origin;
    const tokenInput = document.getElementById('admin-token');
    tokenInput.value = window.sessionStorage.getItem('omaha-admin-token') || '';

    function saveTokenAndLoad() {
      const token = tokenInput.value.trim();
      if (token) window.sessionStorage.setItem('omaha-admin-token', token);
      else window.sessionStorage.removeItem('omaha-admin-token');
      void loadStats().catch(showError);
    }

    function escapeHtml(value) {
      return String(value ?? '-')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(timestamp) {
      return timestamp ? new Date(timestamp).toLocaleString('ru-RU') : '-';
    }

    function formatDuration(milliseconds) {
      const seconds = Math.max(0, Math.round((milliseconds || 0) / 1000));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const rest = seconds % 60;
      return [
        hours ? `${hours} ч` : '',
        minutes ? `${minutes} мин` : '',
        `${rest} сек`,
      ].filter(Boolean).join(' ');
    }

    function resolution(width, height) {
      return width && height ? `${width}×${height}` : '-';
    }

    function table(headers, rows) {
      if (headers.includes('User-Agent')) {
        headers = [headers[0], 'Player', 'Cookie', ...headers.slice(1), 'Games played', 'Win rate'];
      }
      return `
        <table>
          <thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.length ? rows.join('') : `<tr><td colspan="${headers.length}" class="muted">Пока нет данных</td></tr>`}
          </tbody>
        </table>
      `;
    }

    async function loadStats() {
      const token = window.sessionStorage.getItem('omaha-admin-token');
      const response = await fetch(`${API_URL}/admin/stats`, {
        headers: token ? { Authorization: `Bearer ${token}` } : {},
      });
      if (!response.ok) throw new Error(await response.text());
      const stats = await response.json();
      const totals = stats.totals || {};

      document.getElementById('updated').textContent = `Обновлено: ${formatDate(stats.generatedAt)}`;
      document.getElementById('cards').innerHTML = [
        ['Запусков раздачи', totals.deals || 0],
        ['Игровых сессий', totals.parties || 0],
        ['Сыграно партий', totals.parties || 0],
        ['Общее активное время', formatDuration(totals.activeMs)],
        ['Среднее время сессии', formatDuration(totals.averagePartyActiveMs)],
        ['Подключений', totals.visits || 0],
        ['Уникальных IP', totals.uniqueIps || 0],
      ].map(([label, value]) => `
        <div class="card">
          <span class="muted">${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
        </div>
      `).join('');

      document.getElementById('devices').innerHTML = table(
        ['Тип устройства', 'Платформа', 'Подключений'],
        (stats.devices || []).map((device) => `
          <tr>
            <td>${escapeHtml(device.deviceType)}</td>
            <td>${escapeHtml(device.platform)}</td>
            <td>${escapeHtml(device.visits)}</td>
          </tr>
        `),
      );

      document.getElementById('accesses').innerHTML = table(
        ['Последняя активность', 'IP-адрес', 'Устройство', 'Платформа', 'Экран', 'Окно', 'Подключений', 'User-Agent'],
        (stats.accesses || []).map((access) => `
          <tr>
            <td>${escapeHtml(formatDate(access.lastSeen))}</td>
            <td>${escapeHtml(access.playerName)}</td>
            <td>${escapeHtml(access.clientCookie)}</td>
            <td>${escapeHtml(access.ip)}</td>
            <td>${escapeHtml(access.deviceType)}</td>
            <td>${escapeHtml(access.platform)}</td>
            <td>${escapeHtml(resolution(access.screenWidth, access.screenHeight))}</td>
            <td>${escapeHtml(resolution(access.viewportWidth, access.viewportHeight))}</td>
            <td>${escapeHtml(access.gamesPlayed)}</td>
            <td>${escapeHtml(`${access.winPercent}%`)}</td>
            <td>${escapeHtml(access.connections)}</td>
            <td class="user-agent">${escapeHtml(access.userAgent)}</td>
          </tr>
        `),
      );
    }

    loadStats().catch(showError);
    window.setInterval(() => loadStats().catch(showError), 15_000);

    function showError(error) {
      document.getElementById('updated').textContent = 'Не удалось загрузить статистику.';
      document.getElementById('cards').innerHTML = `
        <div class="card error">${escapeHtml(error.message || error)}</div>
      `;
    }
  </script>
</body>
</html>
